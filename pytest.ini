[pytest]
# Python tests live in tests_py/. The tests/ directory holds C fixtures and
# compiled binaries, not Python.
testpaths = tests_py

# Make scripts/ importable so tests can `from tracer.writer import ...` without
# a conftest.py doing sys.path surgery.
pythonpath = scripts

# Deliberately NARROWER than pytest's default (`test_*.py *_test.py`). The
# default `*_test.py` pattern matches scripts/daikon_test.py and
# scripts/archive/unicorn_test.py, which are executable scripts, not tests:
# daikon_test.py runs `pefile.PE("test.exe")` at module level against a file
# that does not exist in the repo root, so collecting it raises before a single
# test runs.
python_files = test_*.py

# Vendored trees. Without these, a bare `pytest .` walks daikon/ (thousands of
# files, full java source tree), unicorn-2.0.1/, and venv/ and hangs rather
# than failing - verified. testpaths already covers the default invocation;
# this protects explicit-path invocations too.
norecursedirs =
    daikon
    unicorn-2.0.1
    fjalar
    venv
    java
    dll
    docs
    examples
    traces
    invariants
    daikon-output
    tests
    .git
    __pycache__

markers =
    e2e: requires Unicorn and compiled binaries in tests/ (deselect with '-m "not e2e"')

addopts = -ra
